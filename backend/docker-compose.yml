version: '3.8'

services:
  auth-service:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn auth_service.main:app --host 0.0.0.0 --port 8001 --reload
    ports:
      - "8001:8001"
    environment:
      - SERVICE_NAME=auth-service
      - PORT=8001

  trip-service:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn trip_service.main:app --host 0.0.0.0 --port 8002 --reload
    ports:
      - "8002:8002"
    environment:
      - SERVICE_NAME=trip-service
      - PORT=8002

  booking-service:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn booking_service.main:app --host 0.0.0.0 --port 8003 --reload
    ports:
      - "8003:8003"
    environment:
      - SERVICE_NAME=booking-service
      - PORT=8003

  chat-service:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn chat_service.main:app --host 0.0.0.0 --port 8004 --reload
    ports:
      - "8004:8004"
    environment:
      - SERVICE_NAME=chat-service
      - PORT=8004

  notification-service:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn notification_service.main:app --host 0.0.0.0 --port 8005 --reload
    ports:
      - "8005:8005"
    environment:
      - SERVICE_NAME=notification-service
      - PORT=8005
